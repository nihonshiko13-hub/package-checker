<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>パッケージ照合アプリ</title>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: sans-serif; margin: 0 auto; padding: 16px; max-width: 600px; background: #f4f4f9; color: #333; }
    h1 { font-size: 24px; }
    .card { background: white; padding: 16px; border-radius: 8px; margin-bottom: 16px; }
    label { display: block; margin-bottom: 6px; }
    select, button { width: 100%; padding: 12px; font-size: 16px; margin-bottom: 12px; }
    button { background: #007bff; color: white; border: 0; border-radius: 4px; font-weight: bold; }
    button:disabled { opacity: .5; }
    #cameraContainer { position: relative; width: 100%; background: black; overflow: hidden; }
    video { display: block; width: 100%; height: auto; }
    .overlay-box { position: absolute; border: 3px solid red; pointer-events: none; }
    .overlay-label { background: red; color: white; font-size: 11px; padding: 1px 4px; }
    #captureBtn { background: #238636; margin-top: 12px; }
    #status { white-space: pre-wrap; overflow-wrap: anywhere; }
    #finalResult { font-size: 28px; font-weight: bold; }
    .ok { color: #16803c; } .ng { color: #c62828; } .pending { color: #775400; }
    .previews { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .previews img { display: block; width: 100%; border: 1px solid #aaa; background: #eee; }
    .ocr-text { white-space: pre-wrap; overflow-wrap: anywhere; }
    small { display: block; line-height: 1.6; margin-bottom: 12px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <h1>パッケージ照合アプリ</h1>
  <div class="card">
    <label for="packageSelect">1. パッケージを選択</label>
    <select id="packageSelect" disabled><option value="">読み込み中…</option></select>
    <label for="languageSelect">照合するコード</label>
    <select id="languageSelect">
      <option value="eng">英字2文字＋数字2桁（例：AD80・BC12）</option>
    </select>
    <label for="captureMode">撮影画質</label>
    <select id="captureMode"><option value="photo">高画質静止画を優先（対応端末）</option><option value="video">従来の連写</option></select>
    <small>無料・文字候補確認V6.2。撮影中はスマホを動かさずお待ちください。対応端末では、カメラの静止画を使って文字を読み取ります。</small>
    <p id="status" role="status" aria-live="polite">マスターを読み込んでいます。</p>
  </div>
  <div class="card" id="cameraCard" hidden>
    <p>2. 赤枠の中に文字を合わせて撮影</p>
    <div id="cameraContainer">
      <video id="videoElement" autoplay playsinline muted></video>
      <div id="boxA" class="overlay-box"><span class="overlay-label">A位置</span></div>
      <div id="boxB" class="overlay-box"><span class="overlay-label">B位置</span></div>
    </div>
    <button id="captureBtn" disabled>この位置で撮影・判定する</button>
  </div>
  <div class="card" id="resultArea" hidden>
    <h2>判定結果</h2>
    <p id="analysisStatus" role="status" aria-live="polite"></p>
    <p id="captureInfo"></p>
    <details id="photoDiagnostics" hidden><summary>撮影範囲を確認する</summary><p><a id="downloadCameraPhoto" download="camera-photo.jpg" hidden>カメラ写真（全体）を保存</a></p><p><a id="downloadReferenceFrame" download="preview-frame.png" hidden>比較用の映像（全体）を保存</a></p></details>
    <div class="previews">
      <div><p>Aの切り抜き画像</p><img id="previewA" alt="A位置の切り抜き画像"><small id="imageSizeA"></small><a id="downloadA" download="A-crop.png" hidden>A画像を保存</a></div>
      <div><p>Bの切り抜き画像</p><img id="previewB" alt="B位置の切り抜き画像"><small id="imageSizeB"></small><a id="downloadB" download="B-crop.png" hidden>B画像を保存</a></div>
    </div>
    <p>A位置のコード：<span id="textAVal" class="ocr-text">-</span></p>
    <p>B位置のコード：<span id="textBVal" class="ocr-text">-</span></p>
    <details><summary>読み取りの詳細</summary><p id="detailA" class="ocr-text"></p><p id="detailB" class="ocr-text"></p></details>
    <p><a id="downloadReport" href="#" download="recognition-details.txt" onclick="prepareRecognitionReport()">読み取りの詳細をファイルで保存</a></p>
    <p>判定：<span id="finalResult" class="pending">未判定</span></p>
    <p id="saveStatus" role="status" aria-live="polite">履歴：未保存</p>
    <button id="saveRetryBtn" hidden>履歴の保存を再試行する</button>
    <button id="retryBtn">もう一度撮影する</button>
  </div>
  <script>
    const GAS_API_URL = 'https://script.google.com/macros/s/AKfycbx6nPWaiFOI-s2-q0QhEAlVtz05TA4Ba3bEkTNoG6tQvfENyNTX-z7kEY2_3eU0kWZt/exec';
    const el = id => document.getElementById(id);
    const video = el('videoElement');
    let masterData = [];
    let mediaStream = null;
    let busy = false;
    let cameraGeneration = 0;
    let logApiReady = false;
    let pendingRecord = null;
    let saving = false;
    let cameraPhotoUrl = null;
    function prepareRecognitionReport() {
      const pkg=selectedPackage();
      const report=[
        'パッケージ照合アプリ V6.2 読み取り詳細',
        '保存日時：'+new Date().toISOString(),
        'パッケージ：'+(pkg?String(pkg.packageId)+' '+String(pkg.packageName):'未選択'),
        'マスク座標：'+(pkg?JSON.stringify({a:pkg.a,b:pkg.b}):'なし'),
        el('captureInfo').textContent,
        'A画像サイズ：'+el('imageSizeA').textContent,
        'B画像サイズ：'+el('imageSizeB').textContent,
        'Aコード：'+el('textAVal').textContent,
        'Bコード：'+el('textBVal').textContent,
        '判定：'+el('finalResult').textContent,
        el('status').textContent,
        el('saveStatus').textContent,
        '',el('detailA').textContent,'',el('detailB').textContent
      ].join('\n');
      el('downloadReport').href='data:text/plain;charset=utf-8,'+encodeURIComponent('\uFEFF'+report);
    }
    function clearPhotoDiagnostics() {
      if(cameraPhotoUrl&&typeof URL!=='undefined')URL.revokeObjectURL(cameraPhotoUrl);
      cameraPhotoUrl=null;
      el('photoDiagnostics').hidden=true;
      for(const id of ['downloadCameraPhoto','downloadReferenceFrame']){el(id).hidden=true;el(id).removeAttribute('href');}
    }
    function setPhotoDiagnostics(blob,reference) {
      if(typeof URL!=='undefined'&&typeof URL.createObjectURL==='function') {
        cameraPhotoUrl=URL.createObjectURL(blob);el('downloadCameraPhoto').href=cameraPhotoUrl;
        el('downloadCameraPhoto').download=blob.type==='image/png'?'camera-photo.png':'camera-photo.jpg';el('downloadCameraPhoto').hidden=false;
      }
      if(typeof reference.toDataURL==='function') {el('downloadReferenceFrame').href=reference.toDataURL('image/png');el('downloadReferenceFrame').hidden=false;}
      el('photoDiagnostics').hidden=false;
    }
    const MIN_CODE_CONFIDENCE = 60;
    function normalizeCodeText(text) {
      return String(text || '').normalize('NFKC').toUpperCase();
    }
    function ocrConfidence(value) {
      return Number.isFinite(Number(value)) ? Math.max(0, Math.min(100, Number(value))) : 0;
    }
    function codeMatches(text) {
      const normalized = normalizeCodeText(text);
      const pattern = /(?:^|[^A-Z0-9])([A-Z])[ \t]*([A-Z])[ \t]*([0-9])[ \t]*([0-9])(?=$|[^A-Z0-9])/g;
      return Array.from(normalized.matchAll(pattern), match => ({
        code: match[1] + match[2] + match[3] + match[4],
        start: match.index + (/^[A-Z0-9]/.test(match[0]) ? 0 : 1),
        end: match.index + match[0].length
      })).filter(match=>{
        let left=match.start,right=match.end;
        while(left>0&&!/\s/.test(normalized[left-1]))left--;
        while(right<normalized.length&&!/\s/.test(normalized[right]))right++;
        // 番号の途中の記号を区切りと誤認し、先頭4文字だけを採用しない。
        return normalized.slice(left,right).replace(/[^A-Z0-9]/g,'')===match.code;
      });
    }
    function candidatesFromOcr(data) {
      // 同じ行の単語だけを結合し、離れた行から4文字を作らない。
      const lines = data.lines && data.lines.length ? data.lines : String(data.text || '').split(/\r?\n/).map(text => ({ text, confidence: data.confidence }));
      const found = [];
      for (const line of lines) {
        const words = line.words || [];
        if (!words.length) {
          for (const match of codeMatches(line.text)) found.push({ code: match.code, confidence: ocrConfidence(line.confidence), bbox:line.bbox });
          continue;
        }
        let text = '';
        const spans = [];
        for (const word of words) {
          if (text) text += ' ';
          const start = text.length;
          const wordText=normalizeCodeText(word.text);
          text += wordText;
          const symbols=word.symbols||[];
          if(symbols.length && symbols.map(symbol=>normalizeCodeText(symbol.text)).join('')===wordText) {
            let offset=start;
            for(const symbol of symbols) {
              const value=normalizeCodeText(symbol.text);
              if(/[A-Z0-9]/.test(value))spans.push({start:offset,end:offset+value.length,confidence:ocrConfidence(symbol.confidence),bbox:symbol.bbox});
              offset+=value.length;
            }
          }else{
            spans.push({ start, end: text.length, confidence: ocrConfidence(word.confidence),bbox:word.bbox });
          }
        }
        for (const match of codeMatches(text)) {
          const overlaps = spans.filter(span => span.start < match.end && span.end > match.start);
          const boxes=overlaps.map(span=>span.bbox).filter(box=>box&&['x0','x1','y0','y1'].every(key=>Number.isFinite(box[key])));
          const bbox=boxes.length===overlaps.length&&boxes.length?{x0:Math.min(...boxes.map(b=>b.x0)),y0:Math.min(...boxes.map(b=>b.y0)),x1:Math.max(...boxes.map(b=>b.x1)),y1:Math.max(...boxes.map(b=>b.y1))}:undefined;
          found.push({ code: match.code, confidence: overlaps.length ? Math.min(...overlaps.map(span => span.confidence)) : 0,bbox });
        }
      }
      return found;
    }
    function summarizeCodePasses(passes) {
      const candidates = new Map();
      const accepted=passes.flatMap(pass=>pass.candidates).filter(item=>item.confidence>=MIN_CODE_CONFIDENCE);
      const nearAccepted=code=>accepted.some(item=>Array.from(code).filter((letter,index)=>letter!==item.code[index]).length<=1);
      // 境界だけの候補は確定しない。確定候補と1文字違う場合は誤読の疑いを残す。
      for (const pass of passes) for (const candidate of [...pass.candidates,...(pass.rejected||[]).filter(item=>item.confidence>=MIN_CODE_CONFIDENCE&&(!accepted.length||nearAccepted(item.code))).map(item=>({...item,confidence:0}))]) {
        const previous = candidates.get(candidate.code);
        if (!previous || candidate.confidence > previous.confidence) candidates.set(candidate.code, { ...candidate, angle: pass.angle });
      }
      const list = Array.from(candidates.values()).sort((a, b) => b.confidence - a.confidence);
      const state = list.length > 1 ? 'ambiguous' : !list.length ? 'missing' : list[0].confidence < MIN_CODE_CONFIDENCE ? 'uncertain' : 'read';
      const evidence=passes.flatMap(pass=>[
        ...pass.candidates.map(item=>'['+pass.angle+'度・'+(pass.region||'')+'] 候補 '+item.code+'／確信度 '+item.confidence.toFixed(1)),
        ...(pass.rejected||[]).map(item=>'['+pass.angle+'度・'+(pass.region||'')+'] 境界のため保留 '+item.code+'／確信度 '+item.confidence.toFixed(1))
      ]);
      const rawText=['候補の確認結果',...(evidence.length?evidence:['候補なし']),'','読み取り原文',...passes.map(pass=>'['+pass.angle+'度'+(pass.region?'・'+pass.region:'')+']\n'+pass.text)].join('\n').slice(0,10000);
      return { state, code: state === 'read' ? list[0].code : '', candidates: list.map(item => item.code), confidence: list[0]?.confidence || 0, angle: list[0]?.angle || 0, rawText };
    }
    function judgeCodeResults(a, b) {
      if ([a.state, b.state].some(state => state === 'ambiguous' || state === 'uncertain')) return '要確認';
      if (a.state !== 'read' || b.state !== 'read') return '読取不可';
      return a.code === b.code ? 'OK' : 'NG';
    }
    function makeRecognitionImage(source, angle, binary = false) {
      const radians=angle*Math.PI/180;
      // 高画質写真を得た場合も、OCR側で過大に拡大しない。
      const scale=Math.min(3,600/Math.min(source.width,source.height),1800/Math.max(source.width,source.height));
      const w=source.width*scale,h=source.height*scale;
      const canvas=document.createElement('canvas');
      canvas.width=Math.ceil(Math.abs(w*Math.cos(radians))+Math.abs(h*Math.sin(radians)))+40;
      canvas.height=Math.ceil(Math.abs(h*Math.cos(radians))+Math.abs(w*Math.sin(radians)))+40;
      const context=canvas.getContext('2d',{willReadFrequently:true});
      context.fillStyle='white';context.fillRect(0,0,canvas.width,canvas.height);
      context.translate(canvas.width/2,canvas.height/2);context.rotate(radians);
      context.drawImage(source,-w/2,-h/2,w,h);
      const pixels=context.getImageData(0,0,canvas.width,canvas.height);
      for(let i=0;i<pixels.data.length;i+=4) {
        let gray=pixels.data[i]*.299+pixels.data[i+1]*.587+pixels.data[i+2]*.114;
        if(binary)gray=gray<150?0:255;
        pixels.data[i]=pixels.data[i+1]=pixels.data[i+2]=gray;
      }
      context.putImageData(pixels,0,0);
      return canvas;
    }
    function makeRecognitionTile(source,left,top,heightRatio=.3) {
      const canvas=document.createElement('canvas');
      canvas.width=Math.round(source.width*.75)+40;
      canvas.height=Math.round(source.height*heightRatio)+40;
      const context=canvas.getContext('2d');
      context.fillStyle='white';context.fillRect(0,0,canvas.width,canvas.height);
      context.drawImage(source,source.width*left,source.height*top,source.width*.75,source.height*heightRatio,20,20,canvas.width-40,canvas.height-40);
      return canvas;
    }
    function orientationScore(data) {
      return (data.words||[]).reduce((sum,word)=>{
        const count=(normalizeCodeText(word.text).match(/[A-Z0-9]/g)||[]).length;
        return count>=3?sum+ocrConfidence(word.confidence)*Math.min(count,12):sum;
      },0);
    }
    function completeTileCandidate(candidate,tile) {
      const b=candidate.bbox;
      // タイルの端で切れた長い品番を、4文字コードとして採用しない。
      return !!b&&b.x0>22&&b.y0>22&&b.x1<tile.width-22&&b.y1<tile.height-22;
    }
    function codeWordRegions(data,tile) {
      const words=data.words?.length?data.words:(data.lines||[]).flatMap(line=>line.words||[]);
      return words.filter(word=>{
        const text=normalizeCodeText(word.text).replace(/[^A-Z0-9]/g,'');
        // 形式の近い文字を再撮影画像から読み直す。文字の置換で正解を作らない。
        const b=word.bbox;
        return /^[A-Z]{2}[A-Z0-9]{2}$/.test(text)&&b&&b.x0>22&&b.x1<tile.width-22&&b.y0>=20&&b.y1<=tile.height-20&&(!codeMatches(word.text).length||!completeTileCandidate(word,tile));
      });
    }
    function makeWordImage(source,b) {
      const canvas=document.createElement('canvas'),pad=14;
      canvas.width=b.x1-b.x0+pad*2;canvas.height=b.y1-b.y0+pad*2;
      const context=canvas.getContext('2d');context.fillStyle='white';context.fillRect(0,0,canvas.width,canvas.height);
      context.drawImage(source,b.x0,b.y0-4,b.x1-b.x0,b.y1-b.y0+8,pad,pad-4,b.x1-b.x0,b.y1-b.y0+8);
      return canvas;
    }
    async function recognizeCode(worker,source,label) {
      const passes=[],orientations=[];
      await worker.setParameters({tessedit_pageseg_mode:Tesseract.PSM.SPARSE_TEXT,tessedit_char_whitelist:''});
      for(const base of [0,90,180,270]) {
        let bestScore=0;
        for(const offset of [0,-4,4]) {
          const angle=(base+offset+360)%360;
          status(label+'のコードを解析中（'+angle+'度・傾き補正）。');
          const {data}=await worker.recognize(makeRecognitionImage(source,angle));
          passes.push({angle,region:'傾き補正・グレー',text:data.text||'',candidates:candidatesFromOcr(data)});
          bestScore=Math.max(bestScore,orientationScore(data));
        }
        orientations.push({base,score:bestScore});
      }
      const initial=summarizeCodePasses(passes);
      if(initial.state==='read'||initial.state==='ambiguous')return initial;
      orientations.sort((a,b)=>b.score-a.score);
      let attempts=0,rereads=0;
      try {
        await worker.setParameters({tessedit_pageseg_mode:Tesseract.PSM.SINGLE_LINE});
        for(const mode of ['gray','binary'])for(const {base} of orientations)for(const offset of [0,4,-4]) {
          const angle=(base+offset+360)%360;
          const binary=mode==='binary',image=makeRecognitionImage(source,angle,binary);
          const tops=binary?[.35,.175,.525,0,.7]:[.3,.4,.2,.5,.1,.6,0,.7,.8];
          for(const left of [.25,0])for(const top of tops) {
            status(label+'を自動切り分けして再解析中（'+(++attempts)+'/336）。');
            const tile=makeRecognitionTile(image,left,top,binary?.3:.18);
            const {data}=await worker.recognize(tile);
            const detected=candidatesFromOcr(data);
            passes.push({angle,region:'自動切り分け・'+(binary?'白黒':'グレー')+' '+left+','+top,text:data.text||'',candidates:detected.filter(candidate=>completeTileCandidate(candidate,tile)),rejected:detected.filter(candidate=>!completeTileCandidate(candidate,tile))});
            if(!binary&&rereads<24)for(const word of codeWordRegions(data,tile)) {
              if(rereads++>=24)break;
              await worker.setParameters({tessedit_pageseg_mode:Tesseract.PSM.SINGLE_WORD});
              let reread;
              try{
                // 行分割で上下が切れた場合も、元の回転画像から余白を含めて取り直す。
                const b=word.bbox,extra=4;
                const bounds={x0:b.x0-20+image.width*left,x1:b.x1-20+image.width*left,y0:Math.max(0,b.y0-20+image.height*top-extra),y1:Math.min(image.height,b.y1-20+image.height*top+extra)};
                reread=await worker.recognize(makeWordImage(image,bounds));
              }
              finally{await worker.setParameters({tessedit_pageseg_mode:Tesseract.PSM.SINGLE_LINE});}
              passes.push({angle,region:'文字候補再認識 '+word.text,text:reread.data.text||'',candidates:candidatesFromOcr(reread.data)});
            }
          }
          // 同じ角度の各領域を確認してから判定する。別候補は要確認へ回す。
          const result=summarizeCodePasses(passes);
          if(result.state==='read'||result.state==='ambiguous')return result;
        }
      }finally{
        await worker.setParameters({tessedit_pageseg_mode:Tesseract.PSM.SPARSE_TEXT,tessedit_char_whitelist:''});
      }
      return summarizeCodePasses(passes);
    }

    function showCodeReading(reading, label) {
      el('text' + label + 'Val').textContent = reading.state === 'read' ? reading.code : reading.state === 'ambiguous' ? '要確認：候補 ' + reading.candidates.join('・') : reading.state === 'uncertain' ? '要確認：不鮮明な候補 ' + reading.candidates.join('・') : '（対象コード未検出）';
      el('detail' + label).textContent = label + 'の認識結果\n' + reading.rawText;
    }
    function applyCodeReading(record, label, reading) {
      record['text' + label] = reading.code;
      record['candidates' + label] = reading.candidates;
      record['confidence' + label] = reading.confidence;
      record['rawText' + label] = reading.rawText;
    }
    function updateSaveControls() {
      el('saveRetryBtn').hidden = !pendingRecord || saving;
      el('retryBtn').disabled = busy || saving || !!pendingRecord;
      el('packageSelect').disabled = busy || saving || !!pendingRecord;
      el('captureBtn').disabled = busy || saving || !!pendingRecord || !mediaStream;
      el('captureMode').disabled = busy || saving || !!pendingRecord;
    }
    async function savePendingRecord() {
      if (!pendingRecord || saving) return;
      saving = true;
      el('saveStatus').textContent = '履歴：LOG・判定履歴へ保存中…';
      updateSaveControls();
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 45000);
      try {
        if (!logApiReady) throw new Error('Apps Scriptをコード抽出版へ更新し、ページを開き直してください。');
        const response = await fetch(GAS_API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
          body: JSON.stringify(pendingRecord),
          signal: controller.signal,
          redirect: 'follow'
        });
        if (!response.ok) throw new Error('HTTP ' + response.status);
        let result;
        try { result = await response.json(); }
        catch (_) { throw new Error('保存結果を確認できません。Apps Scriptの公開設定を確認してください。'); }
        if (result.status !== 'success' || result.saveId !== pendingRecord.saveId || !Array.isArray(result.savedSheets) || result.savedSheets.length !== 2) {
          throw new Error(result.message || '2枚のシートへの保存を確認できません。');
        }
        el('saveStatus').textContent = '履歴：' + result.savedSheets.join('・') + 'へ保存済み';
        pendingRecord = null;
      } catch (error) {
        const message = error.name === 'AbortError' ? '保存の確認が時間切れになりました。' : error.message;
        el('saveStatus').textContent = '履歴：保存未確認。' + message + ' 「履歴の保存を再試行する」を押してください。';
      } finally {
        clearTimeout(timeout);
        saving = false;
        updateSaveControls();
      }
    }
    el('saveRetryBtn').addEventListener('click', savePendingRecord);
    window.addEventListener('beforeunload', event => {
      if (pendingRecord) { event.preventDefault(); event.returnValue = ''; }
    });
    function status(message) {
      el('status').textContent = message;
      if (el('analysisStatus')) el('analysisStatus').textContent = message;
    }
    function selectedPackage() {
      return masterData.find(item => String(item.packageId) === el('packageSelect').value);
    }
    function validateArea(area, label) {
      if (!area || ['x', 'y', 'w', 'h'].some(key => !Number.isFinite(Number(area[key])))) {
        throw new Error(label + '：マスターの座標が数値ではありません。');
      }
      const { x, y, w, h } = Object.fromEntries(['x', 'y', 'w', 'h'].map(key => [key, Number(area[key])]));
      if (x < 0 || y < 0 || w <= 0 || h <= 0 || x + w > 100 || y + h > 100) {
        throw new Error(label + '：座標は画像全体に対する0～100の割合で指定してください。幅・高さは0より大きく、枠は画像内に収めてください。');
      }
      return { x, y, w, h };
    }
    function stopCamera() {
      cameraGeneration++;
      if (mediaStream) mediaStream.getTracks().forEach(track => track.stop());
      mediaStream = null;
      video.srcObject = null;
      el('captureBtn').disabled = true;
    }
    function updateOverlayBoxes() {
      const pkg = selectedPackage();
      if (!pkg) return;
      for (const [id, area] of [['boxA', pkg.a], ['boxB', pkg.b]]) {
        const a = validateArea(area, id === 'boxA' ? 'A' : 'B');
        Object.assign(el(id).style, { left: a.x + '%', top: a.y + '%', width: a.w + '%', height: a.h + '%' });
      }
    }
    async function startCamera() {
      stopCamera();
      const generation = cameraGeneration;
      try {
        updateOverlayBoxes();
        status('カメラを起動しています。');
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false
        });
        if (generation !== cameraGeneration) {
          stream.getTracks().forEach(track => track.stop());
          return;
        }
        mediaStream = stream;
        video.srcObject = stream;
        await video.play();
        if (generation !== cameraGeneration) return;
        el('captureBtn').disabled = false;
        status('赤枠に文字を合わせ、ピントが合ってから撮影してください。');
      } catch (error) {
        if (generation !== cameraGeneration) return;
        stopCamera();
        status('カメラ起動エラー：' + error.message + '\nパッケージを選び直して再試行してください。');
      }
    }
    function cropToCanvasBase64(source, area, label) {
      const a = validateArea(area, label);
      const x = Math.round(source.width * a.x / 100);
      const y = Math.round(source.height * a.y / 100);
      const w = Math.min(Math.round(source.width * a.w / 100), source.width - x);
      const h = Math.min(Math.round(source.height * a.h / 100), source.height - y);
      if (w < 1 || h < 1) throw new Error(label + '：切り抜き画像が小さすぎます。');
      const canvas = document.createElement('canvas');
      canvas.width = w;
      canvas.height = h;
      canvas.getContext('2d').drawImage(source, x, y, w, h, 0, 0, w, h);
      return canvas;
    }
    function laplacianVariance(gray, width, height) {
      let sum=0, squares=0, count=0;
      for(let y=1;y<height-1;y++)for(let x=1;x<width-1;x++) {
        const i=y*width+x;
        const value=gray[i-1]+gray[i+1]+gray[i-width]+gray[i+width]-4*gray[i];
        sum+=value;squares+=value*value;count++;
      }
      return count?Math.max(0,squares/count-(sum/count)**2):0;
    }
    function regionSharpness(frame, area) {
      const canvas=document.createElement('canvas');
      canvas.width=160;
      canvas.height=Math.max(3,Math.min(160,Math.round(160*frame.height*area.h/(frame.width*area.w))));
      const context=canvas.getContext('2d',{willReadFrequently:true});
      context.drawImage(frame,frame.width*area.x/100,frame.height*area.y/100,frame.width*area.w/100,frame.height*area.h/100,0,0,canvas.width,canvas.height);
      const pixels=context.getImageData(0,0,canvas.width,canvas.height).data;
      const gray=new Float32Array(canvas.width*canvas.height);
      for(let i=0;i<gray.length;i++)gray[i]=pixels[i*4]*.299+pixels[i*4+1]*.587+pixels[i*4+2]*.114;
      return laplacianVariance(gray,canvas.width,canvas.height);
    }
    function combinedSharpness(a,b) {
      // 片方だけが鮮明な写真より、両方が写っている写真を優先する。
      return 2/(1/(a+1)+1/(b+1));
    }
    async function captureBestFrame(pkg) {
      const a=validateArea(pkg.a,'A'),b=validateArea(pkg.b,'B');
      const generation=cameraGeneration;
      let best=null,bestScore=-1;
      // ボタンを触った瞬間の揺れが収まる時間を取る。
      await new Promise(resolve=>setTimeout(resolve,200));
      for(let index=0;index<5;index++) {
        if(generation!==cameraGeneration || !mediaStream || video.readyState<2 || !video.videoWidth || !video.videoHeight) throw new Error('撮影中に映像が停止しました。もう一度撮影してください。');
        status('連写中（'+(index+1)+'/5）。約1秒間、スマホを動かさずお待ちください。');
        const frame=document.createElement('canvas');
        frame.width=video.videoWidth;frame.height=video.videoHeight;
        frame.getContext('2d').drawImage(video,0,0);
        const score=combinedSharpness(regionSharpness(frame,a),regionSharpness(frame,b));
        if(score>bestScore) {
          if(best){best.width=1;best.height=1;}
          best=frame;bestScore=score;
        }else{frame.width=1;frame.height=1;}
        if(index<4)await new Promise(resolve=>setTimeout(resolve,160));
      }
      return best;
    }
    function centerPhotoGeometry(width,height,angle,aspect) {
      const sideways=angle===90||angle===270;
      const rotatedWidth=sideways?height:width,rotatedHeight=sideways?width:height;
      return rotatedWidth/rotatedHeight>aspect
        ?{width:Math.max(1,Math.round(rotatedHeight*aspect)),height:rotatedHeight}
        :{width:rotatedWidth,height:Math.max(1,Math.round(rotatedWidth/aspect))};
    }
    function normalizedCorrelation(a,b) {
      if(a.length!==b.length||!a.length)return -1;
      let ma=0,mb=0;for(let i=0;i<a.length;i++){ma+=a[i];mb+=b[i];}ma/=a.length;mb/=b.length;
      let aa=0,bb=0,ab=0;for(let i=0;i<a.length;i++){const x=a[i]-ma,y=b[i]-mb;aa+=x*x;bb+=y*y;ab+=x*y;}
      return aa>0&&bb>0?ab/Math.sqrt(aa*bb):-1;
    }
    function photoWindowGeometry(width,height,angle,aspect,options={}) {
      const base=centerPhotoGeometry(width,height,angle,aspect),sideways=angle===90||angle===270;
      const rotatedWidth=sideways?height:width,rotatedHeight=sideways?width:height;
      const factor=Math.max(.55,Math.min(1,Number(options.factor)||1));
      const w=Math.max(1,Math.round(base.width*factor)),h=Math.max(1,Math.round(base.height*factor));
      const maxX=(rotatedWidth-w)/2,maxY=(rotatedHeight-h)/2;
      const offsetX=Math.max(-maxX,Math.min(maxX,(Number(options.dx)||0)*base.width));
      const offsetY=Math.max(-maxY,Math.min(maxY,(Number(options.dy)||0)*base.height));
      return {width:w,height:h,offsetX,offsetY,x:rotatedWidth/2+offsetX-w/2,y:rotatedHeight/2+offsetY-h/2};
    }
    function orientationThumbnail(source,angle,aspect,options={},resolution=64) {
      const crop=photoWindowGeometry(source.width,source.height,angle,aspect,options);
      const canvas=document.createElement('canvas');canvas.width=resolution;canvas.height=Math.max(1,Math.round(resolution/aspect));
      const context=canvas.getContext('2d',{willReadFrequently:true}),scale=canvas.width/crop.width;
      context.fillStyle='white';context.fillRect(0,0,canvas.width,canvas.height);
      context.translate(canvas.width/2-crop.offsetX*scale,canvas.height/2-crop.offsetY*scale);
      context.rotate(angle*Math.PI/180);context.scale(scale,scale);context.drawImage(source,-source.width/2,-source.height/2);
      const pixels=context.getImageData(0,0,canvas.width,canvas.height).data,gray=new Float32Array(canvas.width*canvas.height);
      for(let i=0;i<gray.length;i++)gray[i]=pixels[i*4]*.299+pixels[i*4+1]*.587+pixels[i*4+2]*.114;
      return gray;
    }
    function regionCorrelation(a,b,width,height,area) {
      const left=Math.max(0,Math.floor(width*area.x/100)),top=Math.max(0,Math.floor(height*area.y/100));
      const right=Math.min(width,Math.ceil(width*(area.x+area.w)/100)),bottom=Math.min(height,Math.ceil(height*(area.y+area.h)/100));
      const first=[],second=[];for(let y=top;y<bottom;y++)for(let x=left;x<right;x++){first.push(a[y*width+x]);second.push(b[y*width+x]);}
      return normalizedCorrelation(first,second);
    }
    function matchPhotoOrientation(photo,reference,pkg) {
      const aspect=reference.width/reference.height;
      const targets={64:orientationThumbnail(reference,0,aspect,{},64),96:orientationThumbnail(reference,0,aspect,{},96)};
      let best={angle:0,factor:1,dx:0,dy:0,score:-1,rank:-2};
      const seen=new Set();
      function evaluate(angle,factor,dx,dy,resolution) {
        if(factor<.55||factor>1)return;
        const geometry=photoWindowGeometry(photo.width,photo.height,angle,aspect,{factor,dx,dy});
        const key=[resolution,angle,geometry.width,geometry.height,Math.round(geometry.x),Math.round(geometry.y)].join(',');
        if(seen.has(key))return;seen.add(key);
        const candidate=orientationThumbnail(photo,angle,aspect,{factor,dx,dy},resolution),target=targets[resolution];
        const score=normalizedCorrelation(target,candidate);
        let rank=score,a,b;
        if(pkg&&resolution===96) {
          const height=Math.max(1,Math.round(resolution/aspect));
          a=regionCorrelation(target,candidate,resolution,height,pkg.a);b=regionCorrelation(target,candidate,resolution,height,pkg.b);
          rank=.6*score+.2*a+.2*b;
        }
        if(rank>best.rank)best={angle,factor,dx,dy,score,rank,a,b};
      }
      // 静止画と動画の中央位置だけでなく、画角と上下左右のずれを探索する。
      for(const angle of [0,90,180,270])for(const factor of [1,.9,.8,.7,.6])for(const dx of [0,-.12,.12])for(const dy of [0,-.12,.12])evaluate(angle,factor,dx,dy,64);
      // A・Bの両方が合う位置を、粗い探索の周囲で段階的に詰める。
      const coarse=best;best={...coarse,rank:-2};
      for(const [factorStep,shiftStep] of [[.05,.06],[.025,.03],[.0125,.015]]) {
        const center={...best};
        for(const df of [0,-factorStep,factorStep])for(const dx of [0,-shiftStep,shiftStep])for(const dy of [0,-shiftStep,shiftStep])evaluate(center.angle,center.factor+df,center.dx+dx,center.dy+dy,96);
      }
      return best;
    }
    function alignPhoto(photo,reference,match) {
      const parameters=typeof match==='number'?{angle:match}:match;
      const crop=photoWindowGeometry(photo.width,photo.height,parameters.angle,reference.width/reference.height,parameters);
      const canvas=document.createElement('canvas');canvas.width=crop.width;canvas.height=crop.height;
      const context=canvas.getContext('2d');context.translate(canvas.width/2-crop.offsetX,canvas.height/2-crop.offsetY);context.rotate(parameters.angle*Math.PI/180);
      context.drawImage(photo,-photo.width/2,-photo.height/2);return canvas;
    }

    async function cameraOperation(promise,milliseconds) {
      let timer;
      try{return await Promise.race([promise,new Promise((_,reject)=>{timer=setTimeout(()=>reject(new Error('撮影の応答が時間切れになりました。')),milliseconds);})]);}
      finally{clearTimeout(timer);}
    }
    async function captureInspectionFrame(pkg) {
      const reference=await captureBestFrame(pkg);
      reference.captureInfo='従来の連写：'+reference.width+' × '+reference.height+' px';
      if(el('captureMode').value==='video')return reference;
      if(typeof ImageCapture!=='function'||typeof createImageBitmap!=='function') {
        reference.captureInfo+='（このブラウザは高画質静止画に未対応）';return reference;
      }
      let photo;
      const generation=cameraGeneration;
      try{
        status('高画質静止画を撮影しています。スマホを動かさずお待ちください。');
        const track=mediaStream&&mediaStream.getVideoTracks()[0];
        if(!track||track.readyState!=='live')throw new Error('カメラが停止しています。');
        const capturer=new ImageCapture(track);
        const capabilities=await cameraOperation(capturer.getPhotoCapabilities(),4000);
        const maxWidth=Number(capabilities.imageWidth&&capabilities.imageWidth.max),maxHeight=Number(capabilities.imageHeight&&capabilities.imageHeight.max);
        const settings={};
        if(maxWidth>0&&maxHeight>0)settings.imageWidth=Math.round(maxWidth*Math.min(1,4096/Math.max(maxWidth,maxHeight)));
        const blob=await cameraOperation(capturer.takePhoto(settings),8000);
        setPhotoDiagnostics(blob,reference);
        photo=await createImageBitmap(blob);
        if(generation!==cameraGeneration)throw new Error('撮影が中断されました。');
        status('撮影範囲の拡大率と位置を合わせています。');
        const match=matchPhotoOrientation(photo,reference,pkg);
        const crop=photoWindowGeometry(photo.width,photo.height,match.angle,reference.width/reference.height,match);
        if(match.score<.55||(Number.isFinite(match.a)&&match.a<.25)||(Number.isFinite(match.b)&&match.b<.25)) {reference.captureInfo+='（静止画と画角が一致しなかったため）';return reference;}
        if(crop.width*crop.height<=reference.width*reference.height*1.1) {reference.captureInfo+='（静止画の画素数が増えなかったため）';return reference;}
        const canvas=alignPhoto(photo,reference,match);
        canvas.captureInfo='高画質静止画：'+canvas.width+' × '+canvas.height+' px';
        reference.width=reference.height=1;
        return canvas;
      }catch(error){
        if(generation!==cameraGeneration)throw error;
        console.warn('高画質撮影を利用できませんでした',error);
        reference.captureInfo+='（この端末では高画質撮影を利用できなかったため）';return reference;
      }
      finally{if(photo&&typeof photo.close==='function')photo.close();}
    }
    function setResult(text, className = 'pending') {
      el('finalResult').textContent = text;
      el('finalResult').className = className;
    }
    el('packageSelect').addEventListener('change', async () => {
      el('resultArea').hidden = true;
      el('cameraCard').hidden = !selectedPackage();
      if (selectedPackage()) await startCamera();
      else { stopCamera(); status('パッケージを選択してください。'); }
    });
    el('captureBtn').addEventListener('click', async () => {
      if (busy) return;
      busy = true;
      el('captureBtn').disabled = true;
      el('captureBtn').textContent = '撮影中…動かさずお待ちください';
      el('packageSelect').disabled = true;
      el('languageSelect').disabled = true;
      el('captureMode').disabled = true;
      el('retryBtn').disabled = true;
      el('resultArea').hidden = true;
      el('previewA').removeAttribute('src');
      el('previewB').removeAttribute('src');
      for (const label of ['A','B']) { el('download'+label).hidden = true; el('imageSize'+label).textContent = ''; }
      el('textAVal').textContent = '未読取';
      el('textBVal').textContent = '未読取';
      el('detailA').textContent = '';
      el('detailB').textContent = '';
      el('saveStatus').textContent = '履歴：判定後に保存します';
      el('captureInfo').textContent = '';
      clearPhotoDiagnostics();
      setResult('未判定');
      let logContext = null;
      let worker = null;
      try {
        const pkg = selectedPackage();
        if (!pkg) throw new Error('パッケージが選択されていません。');
        if (!logApiReady) throw new Error('Apps Scriptがコード抽出版になっていません。先にApps Scriptを更新してください。');
        if (video.readyState < 2 || video.videoWidth < 1 || video.videoHeight < 1) {
          throw new Error('映像の準備ができていません。もう一度撮影してください。');
        }
        // 同じフレームに写るA・Bを評価し、連写の中から1枚を選ぶ。
        const frame = await captureInspectionFrame(pkg);
        el('captureInfo').textContent=frame.captureInfo;
        const imageA = cropToCanvasBase64(frame, pkg.a, 'A');
        const imageB = cropToCanvasBase64(frame, pkg.b, 'B');
        logContext = { action: 'saveResult', recognitionMode: 'code-2letters-2digits-v1', saveId: crypto.randomUUID(), packageId: String(pkg.packageId), textA: '', textB: '', candidatesA: [], candidatesB: [], confidenceA: 0, confidenceB: 0, rawTextA: '', rawTextB: '', errorMessage: '' };
        el('previewA').src = imageA.toDataURL('image/png');
        el('previewB').src = imageB.toDataURL('image/png');
        for (const [label, image] of [['A',imageA],['B',imageB]]) {
          el('imageSize'+label).textContent = image.width + ' × ' + image.height + ' px';
          el('download'+label).href = el('preview'+label).src;
          el('download'+label).hidden = false;
        }
        // フレーム保存・切り抜き後にカメラを停止する。
        stopCamera();
        el('cameraCard').hidden = true;
        el('resultArea').hidden = false;
        if (typeof Tesseract === 'undefined') throw new Error('文字認識ライブラリを読み込めません。通信環境を確認してください。');
        status('コード認識を準備しています。初回は読み込みに時間がかかります。');
        worker = await Tesseract.createWorker('eng', 1, {}, {load_system_dawg:'0',load_freq_dawg:'0',load_number_dawg:'0',load_punc_dawg:'0'});
        await worker.setParameters({ tessedit_pageseg_mode: Tesseract.PSM.SPARSE_TEXT, user_defined_dpi: '300' });
        const readingA = await recognizeCode(worker, imageA, 'A');
        applyCodeReading(logContext, 'A', readingA);
        showCodeReading(readingA, 'A');
        const readingB = await recognizeCode(worker, imageB, 'B');
        applyCodeReading(logContext, 'B', readingB);
        showCodeReading(readingB, 'B');
        const verdict = judgeCodeResults(readingA, readingB);
        setResult(verdict, verdict === 'OK' ? 'ok' : verdict === 'NG' ? 'ng' : 'pending');
        const messages = { OK: 'A・Bのコードが一致しました。', NG: 'A・Bのコードが異なります。', '要確認': '候補が複数あるか、読み取りが不鮮明です。表示された候補と画像を確認して再撮影してください。', '読取不可': '英字2文字＋数字2桁のコードを検出できませんでした。ピントと写っている範囲を確認してください。' };
        status(messages[verdict]);
        pendingRecord = logContext;
        await savePendingRecord();
      } catch (error) {
        setResult('処理エラー');
        el('resultArea').hidden = false;
        status('処理エラー：' + error.message);
        if (logContext) {
          logContext.errorMessage = error.message;
          pendingRecord = logContext;
          await savePendingRecord();
        } else {
          el('saveStatus').textContent = '履歴：撮影前に中断したため保存していません。';
        }
      } finally {
        if (worker) { try { await worker.terminate(); } catch (_) {} }
        busy = false;
        el('packageSelect').disabled = false;
        el('languageSelect').disabled = false;
        el('retryBtn').disabled = false;
        el('captureBtn').disabled = !mediaStream;
        el('captureBtn').textContent = 'この位置で撮影・判定する';
        updateSaveControls();
      }
    });
    el('retryBtn').addEventListener('click', async () => {
      if (busy || !selectedPackage()) return;
      el('resultArea').hidden = true;
      el('cameraCard').hidden = false;
      await startCamera();
    });
    window.addEventListener('pagehide', stopCamera);
    (async () => {
      try {
        const response = await fetch(GAS_API_URL);
        if (!response.ok) throw new Error('HTTP ' + response.status);
        const result = await response.json();
        if (result.status !== 'success' || !Array.isArray(result.data)) {
          throw new Error(result.message || 'マスターの応答形式が正しくありません。');
        }
        masterData = result.data;
        logApiReady = result.logApiVersion === 1 && result.codeApiVersion === 1;
        el('packageSelect').replaceChildren(new Option('-- パッケージを選択してください --', ''));
        masterData.forEach(item => el('packageSelect').appendChild(new Option(item.packageId + ': ' + item.packageName, String(item.packageId))));
        el('packageSelect').disabled = false;
        status(!logApiReady ? '先にApps Scriptをコード抽出版へ更新してください。更新後、このページを開き直してください。' : masterData.length ? 'パッケージを選択してください。' : 'マスターが0件です。Masterシートを確認してください。');
      } catch (error) {
        el('packageSelect').replaceChildren(new Option('マスター取得失敗', ''));
        status('マスター取得エラー：' + error.message + '\n通信環境とApps Scriptの公開設定を確認してください。');
      }
    })();
  </script>
